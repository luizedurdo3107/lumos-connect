<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Lumos Connect | Formulário</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/front-end/pages/forms/forms3/forms3.css">
</head>

<body>

    <main class="forms-page">

        <header class="top-header">

            <a
                href="#"
                class="brand">

                <img
                    src="/front-end/assets/logo/robolumosconnect.png"
                    alt="Lumos Connect">

                <div class="brand-name">

                    <strong>LUMOS</strong>

                    <span>
                        — CONNECT —
                    </span>

                </div>

            </a>

            <div class="progress-container">

                <div class="progress-info">
                    Passo 3 de 4
                </div>

                <div class="progress-bar">

                    <div class="progress-line">

                        <div class="progress-fill"></div>

                        <div class="progress-step completed">

                            <i data-lucide="check"></i>

                        </div>

                        <div class="progress-step completed">

                            <i data-lucide="check"></i>

                        </div>

                        <div class="progress-step active"></div>

                        <div class="progress-step"></div>

                    </div>

                </div>

            </div>

        </header>

        <section class="content">


            <span class="decoration decoration-one">
                ✦
            </span>

            <span class="decoration decoration-two">
                ✦
            </span>

            <div class="form-card">


                <div class="form-icon">

                    <i data-lucide="sliders-horizontal"></i>

                </div>

                <div class="form-header">

                    <h1>
                        3. O que te ajuda a aprender melhor?
                    </h1>

                    <p>
                        Selecione os recursos ou abordagens que mais fazem diferença para você.
                    </p>

                </div>

                <form id="forms3Form">

                    <div class="options-grid">

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="conteudos-visuais">

                            <span class="checkbox"></span>

                            <i data-lucide="image"></i>

                            <span class="option-text">
                                Conteúdos visuais (imagens, vídeos)
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="audios">

                            <span class="checkbox"></span>

                            <i data-lucide="volume-2"></i>

                            <span class="option-text">
                                Áudios / leitura em voz alta
                            </span>

                        </label>


                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="resumos">

                            <span class="checkbox"></span>

                            <i data-lucide="notebook-pen"></i>

                            <span class="option-text">
                                Resumos e mapas mentais
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="checklists">

                            <span class="checkbox"></span>

                            <i data-lucide="list-checks"></i>

                            <span class="option-text">
                                Listas e checklists
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="passo-a-passo">

                            <span class="checkbox"></span>

                            <i data-lucide="footprints"></i>

                            <span class="option-text">
                                Instruções passo a passo
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="mais-tempo">

                            <span class="checkbox"></span>

                            <i data-lucide="clock-3"></i>

                            <span class="option-text">
                                Mais tempo para atividades
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="exemplos-praticos">

                            <span class="checkbox"></span>

                            <i data-lucide="presentation"></i>

                            <span class="option-text">
                                Exemplos práticos
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="learningResources"
                                value="outros">

                            <span class="checkbox"></span>

                            <i data-lucide="ellipsis"></i>

                            <span class="option-text">
                                Outros recursos
                            </span>

                        </label>

                    </div>

                    <span
                        class="error-message"
                        id="resourceError"
                    ></span>

                    <div class="form-footer">

                        <button
                            type="button"
                            class="back-button"
                            id="backButton">

                            <i data-lucide="arrow-left"></i>

                            <span>
                                Voltar
                            </span>

                        </button>

                        <button
                            type="submit"
                            class="next-button">

                            <span>
                                Próximo
                            </span>

                            <i data-lucide="arrow-right"></i>

                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="/front-end/pages/forms/forms3/forms3.js"></script>
</body>
</html>
