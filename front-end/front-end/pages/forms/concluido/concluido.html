<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumos Connect | Concluído</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/front-end/pages/forms/concluido/concluido.css">
</head>
<body>
    <main class="forms-page">
        <header class="top-header">

            <a
                href="#"
                class="brand">

                <img
                    src="/front-end/assets/logo/robolumosconnect.png"
                    alt="Lumos Connect">

                <div class="brand-name">

                    <strong>LUMOS</strong>

                    <span>
                        — CONNECT —
                    </span>

                </div>

            </a>

            <div class="progress-container">

                <div class="progress-info">
                    Concluído!
                </div>

                <div class="progress-bar">

                    <div class="progress-line">

                        <div class="progress-fill"></div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                    </div>
                </div>
            </div>
        </header>


        <section class="content">

            <span class="decoration decoration-one">
                ✦
            </span>

            <span class="decoration decoration-two">
                ✦
            </span>


            <div class="complete-card">


                <div class="complete-icon">

                    <i data-lucide="party-popper"></i>

                </div>

                <h1>
                    Obrigada! <span>♥</span>
                </h1>

                <p class="complete-description">

                    Suas respostas vão nos ajudar a personalizar sua experiência
                    <br>
                    e tornar o Lumos Connect cada vez melhor para você.

                </p>

                <div class="security-box">

                    <i data-lucide="lock"></i>

                    <div>

                        <strong>
                            Suas informações são seguras
                        </strong>

                        <span>
                            e usadas apenas para personalizar sua experiência.
                        </span>
                    </div>
                </div>

                <button
                    type="button"
                    class="start-button"
                    id="startButton">

                    <span>
                        Começar a usar
                    </span>

                    <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </section>
    </main>
    <script src="/front-end/pages/forms/concluido/concluido.js"></script>
</body>
</html>
