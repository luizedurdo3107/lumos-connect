<!DOCTYPE html>
<html lang="pt-BR">
<head>
     <meta charset="UTF-8">
     <meta  name="viewport"content="width=device-width, initial-scale=1.0">
     <title>Lumos Connect | Etapa 4</title>
     <script src="https://unpkg.com/lucide@latest"></script>
     <link rel="stylesheet"href="/front-end/pages/forms/forms4/forms4.css">
</head>
<body>
    <main class="forms-page">
        <header class="top-header">
            <a
                href="#"
                class="brand" >

                <img
                    src="/front-end/assets/logo/robolumosconnect.png"
                    alt="Lumos Connect" >

                <div class="brand-name">
                    <strong>LUMOS</strong>
                    <span>
                        — CONNECT —
                    </span>
                </div>
            </a>

            <div class="progress-container">
                <div class="progress-info">
                    Passo 4 de 4
                </div>
                <div class="progress-bar">
                    <div class="progress-line">

                        <div class="progress-fill"></div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step active"></div>
                    </div>
                </div>
            </div>
        </header>

        <section class="content">

            <span class="decoration decoration-one">
                ✦
            </span>

            <span class="decoration decoration-two">
                ✦
            </span>


            <div class="form-card">

                <!-- ÍCONE -->

                <div class="form-icon">

                    <i data-lucide="heart"></i>

                </div>

                <div class="form-header">

                    <h1>
                        4. Como podemos tornar sua experiência melhor?
                    </h1>

                    <p>
                        Conte o que ainda podemos melhorar ou adaptar para você.
                    </p>

                </div>

                <form id="forms4Form">

                    <div class="textarea-group">

                        <label for="suggestions">
                            Conte pra gente
                        </label>

                        <textarea
                            id="suggestions"
                            name="suggestions"
                            maxlength="500"
                            placeholder="Escreva aqui suas sugestões, necessidades ou qualquer coisa que ache importante..."
                        ></textarea>

                        <div class="textarea-footer">

                            <span
                                id="characterCount">
                                0/500
                            </span>

                        </div>

                    </div>

                    <span
                        class="error-message"
                        id="suggestionsError"
                    ></span>

                    <div class="form-footer">

                        <button
                            type="button"
                            class="back-button"
                            id="backButton">

                            <i data-lucide="arrow-left"></i>

                            <span>
                                Voltar
                            </span>

                        </button>

                        <button
                            type="submit"
                            class="finish-button">

                            <span>
                                Finalizar
                            </span>

                            <i data-lucide="check"></i>

                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="/front-end/pages/forms/forms4/forms4.js"></script>
</body>
</html>
