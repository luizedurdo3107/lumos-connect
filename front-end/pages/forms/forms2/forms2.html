<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1.0">
<title>Lumos Connect | Formulário</title>
<link rel="stylesheet" href="/front-end/pages/forms/forms2/forms2.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <main class="forms-page">


        <header class="top-header">

            <a
                href="#"
                class="brand">

                <img
                    src="/front-end/assets/logo/robolumosconnect.png"
                    alt="Lumos Connect">

                <div class="brand-name">

                    <strong>LUMOS</strong>

                    <span>
                        — CONNECT —
                    </span>

                </div>

            </a>


            <div class="progress-container">

                <div class="progress-info">

                    <span>
                        Passo 2 de 4
                    </span>

                </div>

                <div class="progress-bar">

                    <div class="progress-line">

                        <div
                            class="progress-fill"
                        ></div>

                        <div class="progress-step completed">
                            <i data-lucide="check"></i>
                        </div>

                        <div class="progress-step active">
                        </div>

                        <div class="progress-step">
                        </div>

                        <div class="progress-step">
                        </div>

                    </div>
                </div>
            </div>
        </header>

        <section class="content">

            <span class="decoration decoration-one">
                ✦
            </span>

            <span class="decoration decoration-two">
                ✦
            </span>

            <div class="form-card">

                <div class="form-icon">

                    <i data-lucide="help-circle"></i>

                </div>
                
                <div class="form-header">

                    <h1>
                        2. Em quais situações você encontra mais dificuldades?
                    </h1>

                    <p>
                        Selecione todas que se aplicam.
                    </p>

                </div>

                <form id="forms2Form">

                    <div class="options-grid">


                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="leitura-textos-longos">

                            <span class="checkbox"></span>

                            <i data-lucide="book-open"></i>

                            <span class="option-text">
                                Leitura de textos longos
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="muitos-estimulos">

                            <span class="checkbox"></span>

                            <i data-lucide="volume-2"></i>

                            <span class="option-text">
                                Ambientes com muito estímulo
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="foco">

                            <span class="checkbox"></span>

                            <i data-lucide="clock-3"></i>

                            <span class="option-text">
                                Manter o foco por muito tempo
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="memorizacao">

                            <span class="checkbox"></span>

                            <i data-lucide="brain"></i>

                            <span class="option-text">
                                Memorização de conteúdos
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="organizacao">

                            <span class="checkbox"></span>

                            <i data-lucide="calendar-days"></i>

                            <span class="option-text">
                                Organização e planejamento
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="comunicacao">

                            <span class="checkbox"></span>

                            <i data-lucide="users-round"></i>

                            <span class="option-text">
                                Interação social / comunicação
                            </span>

                        </label>

                        <label class="option">

                            <input
                                type="checkbox"
                                name="difficulties"
                                value="instrucoes">

                            <span class="checkbox"></span>

                            <i data-lucide="file-text"></i>

                            <span class="option-text">
                                Interpretação de instruções
                            </span>
                        </label>

                        <label class="option">
                            <input
                                type="checkbox"
                                name="difficulties"
                                value="outras">
                            <span class="checkbox"></span>

                            <i data-lucide="ellipsis"></i>

                            <span class="option-text">
                                Outras situações
                            </span>

                        </label>

                    </div>

                    <span
                        class="error-message"
                        id="difficultyError"
                    ></span>

                    <div class="form-footer">
                        <button
                            type="button"
                            class="back-button"
                            id="backButton">

                            <i data-lucide="arrow-left"></i>

                            <span>
                                Voltar
                            </span>

                        </button>

                        <button
                            type="submit"
                            class="next-button">

                            <span>
                                Próximo
                            </span>

                            <i data-lucide="arrow-right"></i>

                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="/front-end/pages/forms/forms2/forms2.js"></script>
</body>
</html>
